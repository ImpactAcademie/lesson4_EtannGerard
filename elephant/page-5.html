<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Éléphant — Protéger les géants</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap');:root{--dark:#30483f;--leaf:#aabd92;--clay:#bb6f58;--paper:#fffdf7;--muted:#707870}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf0e5,#f8eadb);color:#28342f;font-family:'DM Sans',sans-serif}.page{width:min(960px,calc(100% - 36px));margin:auto;padding:38px 0}.tag{color:var(--clay);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.hero{margin-top:25px;padding:clamp(35px,7vw,78px);border-radius:24px;background:var(--dark);color:#fff}.hero h1{max-width:650px;margin:18px 0;font:700 clamp(50px,8vw,86px)/.94 'Playfair Display',serif;letter-spacing:-.06em}.hero p{max-width:580px;color:#d9e2d6;font-size:17px}.promise{margin-top:48px;padding:28px;border-radius:15px;background:var(--paper)}.promise h2{font:700 32px 'Playfair Display',serif}.promise p{color:var(--muted)}button{padding:11px 16px;border:0;border-radius:7px;color:#fff;background:var(--clay);cursor:pointer;font:inherit}#message{display:block;margin-top:16px;color:var(--dark);font-weight:700}</style></head><body><main class="page"><div class="tag">Archives du vivant · page 5</div><section class="hero"><h1>Un avenir à protéger.</h1><p>Protéger les éléphants, c'est préserver des familles, des routes anciennes et des écosystèmes entiers.</p></section><section class="promise"><h2>Une attention concrète</h2><p>Les espaces protégés, la lutte contre le braconnage et la coexistence locale sont essentiels.</p><button id="promise">Afficher une pensée</button><span id="message" aria-live="polite"></span></section></main><script>document.querySelector('#promise').addEventListener('click',()=>document.querySelector('#message').textContent='Un territoire vivant est un territoire que plusieurs espèces peuvent encore partager.');</script></body></html>
