<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lion — À l'heure dorée</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap');:root{--dark:#292321;--orange:#d57d4e;--gold:#e4b15b;--paper:#fff9ef;--muted:#777068}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4e7d1,#efe6dd);color:#292724;font-family:'DM Sans',sans-serif}.page{width:min(970px,calc(100% - 36px));margin:auto;padding:38px 0}.tag{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.hero{margin-top:25px;padding:clamp(35px,7vw,78px);border-radius:24px;background:var(--dark);color:#fff}.hero h1{max-width:650px;margin:18px 0;font:700 clamp(50px,8vw,86px)/.94 'Playfair Display',serif;letter-spacing:-.06em}.hero p{max-width:580px;color:#e1d5c6;font-size:17px}.moment{margin-top:48px;padding:28px;border-radius:15px;background:var(--paper)}.moment h2{font:700 32px 'Playfair Display',serif}.moment p{color:var(--muted)}button{padding:11px 16px;border:0;border-radius:7px;color:var(--dark);background:var(--gold);cursor:pointer;font:inherit}#answer-text{display:block;margin-top:16px;color:var(--orange);font-weight:700}</style></head><body><main class="page"><div class="tag">Archives du vivant · page 4</div><section class="hero"><h1>Quand la chaleur tombe.</h1><p>À la tombée du jour, la savane change de rythme. Les lions commencent à lire les mouvements de la nuit.</p></section><section class="moment"><h2>Le meilleur moment</h2><p>Pourquoi la fraîcheur est-elle importante pour le lion ?</p><button id="answer">Lire la réponse</button><span id="answer-text" aria-live="polite"></span></section></main><script>document.querySelector('#answer').addEventListener('click',()=>document.querySelector('#answer-text').textContent='Les heures fraîches permettent au lion de se déplacer avec moins de dépense.');</script></body></html>
